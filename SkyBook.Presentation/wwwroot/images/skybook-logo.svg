<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" role="img" aria-label="SkyBook Luxury Airways">
  <defs>
    <linearGradient id="wingGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E6A8"/>
      <stop offset="45%" stop-color="#E0B93E"/>
      <stop offset="100%" stop-color="#C49212"/>
    </linearGradient>
    <linearGradient id="wingNavy" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>
  <!-- Wing / paper-plane mark (matches brand screenshot) -->
  <g transform="translate(8,12)">
    <path d="M2 42 L52 2 L38 32 L16 36 Z" fill="url(#wingGold)"/>
    <path d="M16 36 L52 2 L44 48 L26 40 Z" fill="url(#wingNavy)"/>
    <path d="M16 36 L38 32 L26 40 Z" fill="#F0D060" opacity="0.95"/>
  </g>
  <!-- SKYBOOK wordmark -->
  <text x="88" y="46" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="3">
    <tspan fill="#5B6B7C">SKY</tspan><tspan fill="#D4A017">BOOK</tspan>
  </text>
  <text x="92" y="66" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#8A93A0">LUXURY AIRWAYS</text>
</svg>
